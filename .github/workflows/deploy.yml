name: Deploy

on:
  push:
    branches: [main, master] # was [master] only — this repo's default branch is `main`; fixed so pushes actually trigger this
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy (comma-separated, or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mcp-server
          - hq
          - sync

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "851725317896"
  ECS_CLUSTER: lp-internal
  # apps/hq deploys straight to an EC2 box via SSH + local `docker build` —
  # NOT ECS/ECR. See deploy-hq below. mcp-server/sync remain on Fargate.
  EC2_HOST: ec2-54-196-51-180.compute-1.amazonaws.com
  EC2_USER: ubuntu
  REMOTE_APP_DIR: /home/ubuntu/app

jobs:
  # ─── Gate: only deploy after CI passes ───────────────────────────
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # ─── Detect which services changed ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'workflow_dispatch' || needs.ci.result == 'success')
    needs: [ci]
    outputs:
      mcp-server: ${{ steps.detect.outputs.mcp-server }}
      hq: ${{ steps.detect.outputs.hq }}
      sync: ${{ steps.detect.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ github.event.inputs.services }}"
            if [[ "$INPUT" == "all" ]]; then
              echo "mcp-server=true" >> "$GITHUB_OUTPUT"
              echo "hq=true" >> "$GITHUB_OUTPUT"
              echo "sync=true" >> "$GITHUB_OUTPUT"
            else
              for svc in $(echo "$INPUT" | tr ',' ' '); do
                echo "${svc}=true" >> "$GITHUB_OUTPUT"
              done
            fi
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)

          # Shared packages trigger all services
          SHARED=false
          if echo "$CHANGED" | grep -qE '^packages/'; then
            SHARED=true
          fi

          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -qE '^apps/mcp-server/'; then
            echo "mcp-server=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -qE '^apps/hq/'; then
            echo "hq=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$SHARED" == "true" ]] || echo "$CHANGED" | grep -qE '^(apps/sync/|connectors/)'; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Run database migrations ─────────────────────────────────────
  # Runs before any service deploy. Uses an ECS one-off task because
  # the GitHub Actions runner cannot reach RDS (private subnet).
  migrate:
    needs: [changes]
    if: always() && (needs.changes.outputs.mcp-server == 'true' || needs.changes.outputs.hq == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/lp-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Get network config from MCP server service
        id: network
        run: |
          SUBNET=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} \
            --services lp-internal-mcp-server \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets[0]' \
            --output text)
          SG=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} \
            --services lp-internal-mcp-server \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups[0]' \
            --output text)
          echo "subnet=$SUBNET" >> "$GITHUB_OUTPUT"
          echo "sg=$SG" >> "$GITHUB_OUTPUT"

      - name: Run migrations via ECS one-off task
        id: run
        run: |
          # Read migration SQL files that need to be applied and combine them.
          # We use a node script that connects via pg (available in the container)
          # and runs each pending migration's SQL.
          #
          # The ECS task uses the mcp-server task definition which already has
          # DATABASE_URL injected from Secrets Manager.

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition lp-internal-mcp-server \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.network.outputs.subnet }}],securityGroups=[${{ steps.network.outputs.sg }}],assignPublicIp=ENABLED}" \
            --overrides '{
              "containerOverrides": [{
                "name": "mcp-server",
                "command": ["node", "-e", "const pg=require(\"/workspace/node_modules/.pnpm/pg@8.21.0/node_modules/pg\");const p=new pg.Pool({connectionString:process.env.DATABASE_URL});p.query(\"SELECT migration_name FROM _prisma_migrations ORDER BY finished_at\").then(r=>{console.log(\"Applied migrations:\",r.rows.length);r.rows.forEach(row=>console.log(\" \",row.migration_name));p.end();process.exit(0)}).catch(e=>{console.error(String(e));p.end();process.exit(1)})"]
              }]
            }' \
            --query 'tasks[0].taskArn' --output text)

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          TASK_ID=$(echo "$TASK_ARN" | rev | cut -d/ -f1 | rev)
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          echo "Migration task exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task failed with exit code $EXIT_CODE"
            # Fetch logs for debugging
            aws logs get-log-events \
              --log-group-name /ecs/lp-internal-mcp-server \
              --log-stream-name "ecs/mcp-server/$TASK_ID" \
              --query 'events[*].message' --output text || true
            exit 1
          fi

  # ─── Deploy MCP Server ─────────────────────────────────────────
  deploy-mcp-server:
    needs: [changes, migrate]
    if: always() && needs.changes.result == 'success' && needs.migrate.result == 'success' && needs.changes.outputs.mcp-server == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/lp-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp-server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lp-internal/mcp-server:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lp-internal/mcp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register task definition
        id: taskdef
        run: |
          sed "s/\${AWS_ACCOUNT_ID}/${{ env.AWS_ACCOUNT_ID }}/g" \
            infra/ecs/mcp-server-taskdef.json > /tmp/taskdef.json

          # Pin image to this exact SHA instead of :latest
          jq --arg img "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lp-internal/mcp-server:${{ github.sha }}" \
            '.containerDefinitions[0].image = $img' /tmp/taskdef.json > /tmp/taskdef-final.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef-final.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $ARN"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service lp-internal-mcp-server \
            --task-definition ${{ steps.taskdef.outputs.arn }} \
            --force-new-deployment

      - name: Wait for stability
        run: |
          echo "Waiting for service to stabilize (up to 5 minutes)..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services lp-internal-mcp-server

  # ─── Deploy HQ Dashboard ───────────────────────────────────────
  # EC2 + Docker, NOT ECS/Fargate — deliberately not using ECR either: builds
  # straight on the box over SSH, same commands as the manual fallback used to
  # bootstrap this (see docs/runbooks — TODO write one). No AWS IAM/OIDC
  # dependency for this job at all, only the SSH key secret below.
  #
  # PREREQUISITE — this job assumes ${{ env.REMOTE_APP_DIR }} already exists on
  # the box as a git clone of this repo, with a `.env` file already placed at
  # ${{ env.REMOTE_APP_DIR }}/.env (gitignored, never committed — copied over
  # by hand once via scp). The very first deploy MUST be done manually to
  # bootstrap both of those; this job only does `git fetch` + reset after that.
  deploy-hq:
    needs: [changes, migrate]
    if: always() && needs.changes.result == 'success' && needs.migrate.result == 'success' && needs.changes.outputs.hq == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Build + deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.REMOTE_APP_DIR }}
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # TODO(christian): QUICKBOOKS_REDIRECT_URI in this box's .env is
            # still a placeholder pointing at the EC2 hostname — swap it (and
            # re-register the exact URL in Intuit's Redirect URIs tab) the
            # moment the real domain is live. AUTH_URL likely needs the same
            # treatment once NextAuth/Google OAuth creds are configured.
            docker build -f apps/hq/Dockerfile -t lp-hq:latest .
            docker rm -f lp-hq || true
            docker run -d \
              --name lp-hq \
              --env-file ${{ env.REMOTE_APP_DIR }}/.env \
              -p 80:3000 \
              --restart unless-stopped \
              lp-hq:latest

            sleep 5
            docker ps --filter name=lp-hq
            curl -f http://localhost/api/health

      - name: Confirm container is running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker ps --filter name=lp-hq --filter status=running --format '{{.Names}}: {{.Status}}'

  # ─── Build Sync Image (no long-running service — used by EventBridge tasks) ─
  deploy-sync:
    needs: [changes]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/lp-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lp-internal/sync:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/lp-internal/sync:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
